services:
  floci:
    image: floci/floci:2.5.0
    container_name: aws-prod-infra-floci
    ports:
      - "4566:4566"
      - "7001-7099:7001-7099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      - FLOCI_HOSTNAME=localhost
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data

volumes:
  floci-data:
