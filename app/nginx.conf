server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"aws-prod-infra"}';
    }

    location / {
        default_type application/json;
        return 200 '{"message":"aws-prod-infra web tier running","docs":"https://github.com/gg-push/aws-prod-infra"}';
    }
}
