<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" role="img" aria-labelledby="title desc">
  <title id="title">AWS Production Architecture</title>
  <desc id="desc">AWS architecture diagram for aws-prod-infra showing GitHub Actions OIDC, S3 remote state, Multi-AZ VPC across us-east-1a and us-east-1b with ALB, per-AZ NAT Gateways, Auto Scaling EC2 compute, Multi-AZ RDS PostgreSQL, S3, CloudWatch, SNS, Secrets Manager, and SSM.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#545B64"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#147EBA"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#248814"/>
    </marker>
  </defs>

  <!-- Clean white diagram canvas -->
  <rect width="1140" height="620" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, -apple-system, sans-serif">
    <!-- ==================== EXTERNAL ACTORS (LEFT) ==================== -->
    <!-- GitHub Actions -->
    <g transform="translate(44,54)">
      <rect width="40" height="40" rx="4" fill="#24292F"/>
      <circle cx="14" cy="14" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="26" cy="14" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="20" cy="27" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M14 17 v3 c0 3 6 3 6 4 M26 17 v3 c0 3 -6 3 -6 4" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">GitHub Actions</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">CI/CD Pipeline</text>
    </g>

    <!-- Users -->
    <g transform="translate(44,351)">
      <rect width="40" height="40" rx="4" fill="#232F3E"/>
      <circle cx="20" cy="15" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M10 31 c0 -5.5 4.5 -8.5 10 -8.5 s10 3 10 8.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">Users</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">HTTPS :443</text>
    </g>

    <!-- Operator -->
    <g transform="translate(44,514)">
      <rect width="40" height="40" rx="4" fill="#232F3E"/>
      <rect x="9" y="11" width="22" height="15" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
      <path d="M7 29 h26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">Operator</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">No SSH :22</text>
    </g>

    <!-- ==================== AWS CLOUD FRAME ==================== -->
    <rect x="148" y="20" width="972" height="580" rx="2" fill="none" stroke="#232F3E" stroke-width="1.25"/>
    <rect x="148" y="20" width="26" height="26" fill="#232F3E"/>
    <path d="M155 37 h12 a3.2 3.2 0 0 0 .3 -6.4 a4.5 4.5 0 0 0 -8.6 -1.1 a3.5 3.5 0 0 0 -3.7 7.5 z" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <text x="182" y="38" font-size="13" font-weight="700" fill="#232F3E">AWS Cloud (us-east-1)</text>

    <!-- ==================== TOP CONTROL PLANE ==================== -->
    <!-- IAM OIDC Role -->
    <g transform="translate(248,54)">
      <rect width="40" height="40" rx="3" fill="#DD344C"/>
      <path d="M20 9 l9 4 v6.5 c0 5.5 -3.8 9.2 -9 11 c-5.2 -1.8 -9 -5.5 -9 -11 v-6.5 z" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
      <circle cx="20" cy="19.5" r="2.2" fill="#FFFFFF"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">IAM OIDC Role</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">bootstrap/ provider</text>
    </g>

    <!-- S3 Remote State -->
    <g transform="translate(454,54)">
      <rect width="40" height="40" rx="3" fill="#3F8624"/>
      <ellipse cx="20" cy="14" rx="9" ry="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M11 14 v13 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-13" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">S3 Remote State</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">use_lockfile · AES-256</text>
    </g>

    <!-- VPC Flow Logs -->
    <g transform="translate(662,54)">
      <rect width="40" height="40" rx="3" fill="#E7157B"/>
      <rect x="11" y="10" width="18" height="20" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M14.5 16 h11 M14.5 20.5 h11 M14.5 25 h7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <text x="20" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#232F3E">VPC Flow Logs</text>
      <text x="20" y="68" text-anchor="middle" font-size="10.5" fill="#545B64">CloudWatch (30d)</text>
    </g>

    <!-- Top connectors (labels clear of AWS Cloud border) -->
    <line x1="88" y1="74" x2="242" y2="74" stroke="#545B64" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="198" y="66" text-anchor="middle" font-size="10" fill="#545B64">OIDC JWT</text>

    <line x1="292" y1="74" x2="448" y2="74" stroke="#545B64" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="370" y="66" text-anchor="middle" font-size="10" fill="#545B64">tfstate + lock</text>

    <!-- ==================== VPC CONTAINER ==================== -->
    <rect x="180" y="140" width="694" height="444" rx="2" fill="none" stroke="#248814" stroke-width="1.4"/>
    <rect x="180" y="140" width="24" height="24" fill="#248814"/>
    <text x="192" y="156" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">VPC</text>
    <text x="212" y="157" font-size="12.5" font-weight="700" fill="#248814">VPC (10.30.0.0/16 · Default SG Locked)</text>

    <!-- Flow logs connector from VPC top border -->
    <line x1="682" y1="140" x2="682" y2="128" stroke="#545B64" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Internet Gateway straddling VPC left border -->
    <g transform="translate(160,351)">
      <rect width="40" height="40" rx="3" fill="#8C4FFF"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M10 20 h20 M20 10 a5.5 10 0 0 1 0 20 M20 10 a5.5 10 0 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
      <text x="20" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">IGW</text>
    </g>

    <!-- Users -> IGW -->
    <line x1="88" y1="371" x2="154" y2="371" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="118" y="363" text-anchor="middle" font-size="10" fill="#545B64">443/80</text>

    <!-- ==================== AZ-A LANE (y=172..332) ==================== -->
    <rect x="218" y="172" width="640" height="160" rx="2" fill="none" stroke="#147EBA" stroke-width="1.1" stroke-dasharray="5 3"/>
    <text x="228" y="188" font-size="11" font-weight="700" fill="#147EBA">Availability Zone A (us-east-1a)</text>

    <rect x="228" y="195" width="202" height="128" rx="2" fill="#F2F8F0" stroke="#248814" stroke-width="1"/>
    <text x="236" y="210" font-size="10.5" font-weight="700" fill="#248814">Public Subnet</text>

    <rect x="444" y="195" width="402" height="128" rx="2" fill="#F0F6FC" stroke="#147EBA" stroke-width="1"/>
    <text x="452" y="210" font-size="10.5" font-weight="700" fill="#147EBA">Private Subnet</text>

    <!-- ==================== AZ-B LANE (y=412..572) ==================== -->
    <rect x="218" y="412" width="640" height="160" rx="2" fill="none" stroke="#147EBA" stroke-width="1.1" stroke-dasharray="5 3"/>
    <text x="228" y="428" font-size="11" font-weight="700" fill="#147EBA">Availability Zone B (us-east-1b)</text>

    <rect x="228" y="435" width="202" height="128" rx="2" fill="#F2F8F0" stroke="#248814" stroke-width="1"/>
    <text x="236" y="450" font-size="10.5" font-weight="700" fill="#248814">Public Subnet</text>

    <rect x="444" y="435" width="402" height="128" rx="2" fill="#F0F6FC" stroke="#147EBA" stroke-width="1"/>
    <text x="452" y="450" font-size="10.5" font-weight="700" fill="#147EBA">Private Subnet</text>

    <!-- ==================== PUBLIC SUBNET RESOURCES ==================== -->
    <!-- NAT Gateway AZ-a -->
    <g transform="translate(340,218)">
      <rect width="38" height="38" rx="3" fill="#8C4FFF"/>
      <text x="19" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NAT</text>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">NAT Gateway</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">EIP (AZ-a)</text>
    </g>

    <!-- NAT Gateway AZ-b -->
    <g transform="translate(340,468)">
      <rect width="38" height="38" rx="3" fill="#8C4FFF"/>
      <text x="19" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NAT</text>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">NAT Gateway</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">EIP (AZ-b)</text>
    </g>

    <!-- Multi-AZ ALB cleanly centered in the y=336..406 corridor between AZ-a & AZ-b -->
    <rect x="238" y="336" width="84" height="70" rx="4" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.2"/>
    <g transform="translate(261,343)">
      <rect width="38" height="36" rx="3" fill="#8C4FFF"/>
      <circle cx="11" cy="18" r="2.6" fill="#FFFFFF"/>
      <circle cx="27" cy="11" r="2.6" fill="#FFFFFF"/>
      <circle cx="27" cy="25" r="2.6" fill="#FFFFFF"/>
      <path d="M13.5 17 l11 -5 M13.5 19 l11 5" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="19" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">Public ALB</text>
      <text x="19" y="59" text-anchor="middle" font-size="9.5" fill="#545B64">alb-sg · TLS 1.3</text>
    </g>

    <!-- IGW -> ALB -->
    <line x1="200" y1="371" x2="234" y2="371" stroke="#248814" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- ==================== PRIVATE SUBNET RESOURCES ==================== -->
    <!-- Auto Scaling Group Dashed Frame -->
    <rect x="466" y="216" width="164" height="334" rx="3" fill="none" stroke="#ED7100" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text x="548" y="230" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ED7100">Auto Scaling Group (2–4)</text>

    <!-- EC2 Instance AZ-a -->
    <g transform="translate(529,240)">
      <rect width="38" height="38" rx="3" fill="#ED7100"/>
      <rect x="10" y="10" width="18" height="18" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M14 6 v4 M24 6 v4 M14 28 v4 M24 28 v4 M6 14 h4 M6 24 h4 M28 14 h4 M28 24 h4" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">EC2 (t3.micro)</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">app-sg · IMDSv2</text>
    </g>

    <!-- EC2 Instance AZ-b -->
    <g transform="translate(529,466)">
      <rect width="38" height="38" rx="3" fill="#ED7100"/>
      <rect x="10" y="10" width="18" height="18" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M14 6 v4 M24 6 v4 M14 28 v4 M24 28 v4 M6 14 h4 M6 24 h4 M28 14 h4 M28 24 h4" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">EC2 (t3.micro)</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">Nginx · CW Agent</text>
    </g>

    <!-- ALB -> EC2 AZ-a & AZ-b -->
    <path d="M 322 371 H 436 V 262 H 524" fill="none" stroke="#147EBA" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 436 371 V 485 H 524" fill="none" stroke="#147EBA" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <rect x="383" y="355" width="46" height="14" rx="2" fill="#FFFFFF"/>
    <text x="406" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#147EBA">HTTP :80</text>

    <!-- Outbound EC2 -> NAT (dashed) -->
    <path d="M 529 246 H 492 V 237 H 382" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M 529 494 H 492 V 487 H 382" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

    <!-- RDS Primary AZ-a -->
    <g transform="translate(722,240)">
      <rect width="38" height="38" rx="3" fill="#3B48CC"/>
      <ellipse cx="19" cy="13" rx="9" ry="3.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M10 13 v12 c0 1.8 4 3.2 9 3.2 s9 -1.4 9 -3.2 v-12" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">RDS Primary</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">Postgres 16 · db-sg</text>
    </g>

    <!-- RDS Standby AZ-b -->
    <g transform="translate(722,466)">
      <rect width="38" height="38" rx="3" fill="#3B48CC"/>
      <ellipse cx="19" cy="13" rx="9" ry="3.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M10 13 v12 c0 1.8 4 3.2 9 3.2 s9 -1.4 9 -3.2 v-12" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="19" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#232F3E">RDS Standby</text>
      <text x="19" y="65" text-anchor="middle" font-size="10" fill="#545B64">Multi-AZ · Encrypted</text>
    </g>

    <!-- EC2 -> RDS :5432 -->
    <line x1="567" y1="259" x2="717" y2="259" stroke="#3B48CC" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 567 485 H 644 V 267 H 717" fill="none" stroke="#3B48CC" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
    <rect x="652" y="242" width="54" height="14" rx="2" fill="#F0F6FC"/>
    <text x="679" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#3B48CC">TCP :5432</text>

    <!-- RDS Primary -> Standby Sync -->
    <line x1="741" y1="312" x2="741" y2="461" stroke="#3B48CC" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
    <rect x="746" y="365" width="32" height="14" rx="2" fill="#FFFFFF"/>
    <text x="762" y="376" text-anchor="middle" font-size="10" fill="#3B48CC">Sync</text>

    <!-- ==================== RIGHT COLUMN: MANAGED SERVICES ==================== -->
    <!-- S3 Assets -->
    <g transform="translate(944,162)">
      <rect width="38" height="38" rx="3" fill="#3F8624"/>
      <ellipse cx="19" cy="13" rx="8.5" ry="3" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M10.5 13 v12 c0 1.8 3.8 3 8.5 3 s8.5 -1.2 8.5 -3 v-12" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="48" y="16" font-size="11.5" font-weight="700" fill="#232F3E">S3 Assets Bucket</text>
      <text x="48" y="31" font-size="10.5" fill="#545B64">AES-256 · TLS-only</text>
    </g>

    <!-- CloudWatch -->
    <g transform="translate(944,246)">
      <rect width="38" height="38" rx="3" fill="#E7157B"/>
      <path d="M9 27 l6 -7 l5 4 l8 -11" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="16" font-size="11.5" font-weight="700" fill="#232F3E">CloudWatch</text>
      <text x="48" y="31" font-size="10.5" fill="#545B64">Logs &amp; Alarms</text>
    </g>

    <!-- SNS Alerts -->
    <g transform="translate(944,330)">
      <rect width="38" height="38" rx="3" fill="#E7157B"/>
      <path d="M19 9 a6 6 0 0 0 -6 6 v6 l-2 3 h16 l-2 -3 v-6 a6 6 0 0 0 -6 -6 z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M16.5 27 a2.5 2.5 0 0 0 5 0" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="48" y="16" font-size="11.5" font-weight="700" fill="#232F3E">SNS Alerts</text>
      <text x="48" y="31" font-size="10.5" fill="#545B64">KMS · Email</text>
    </g>

    <!-- Secrets Manager -->
    <g transform="translate(944,414)">
      <rect width="38" height="38" rx="3" fill="#DD344C"/>
      <rect x="11" y="17" width="16" height="12" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M14 17 v-3.5 a5 5 0 0 1 10 0 v3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="48" y="16" font-size="11.5" font-weight="700" fill="#232F3E">Secrets Manager</text>
      <text x="48" y="31" font-size="10.5" fill="#545B64">RDS Key Rotation</text>
    </g>

    <!-- SSM Session Manager -->
    <g transform="translate(944,498)">
      <rect width="38" height="38" rx="3" fill="#E7157B"/>
      <path d="M11 14 l6 5 l-6 5 M19 24 h8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="16" font-size="11.5" font-weight="700" fill="#232F3E">SSM Session Mgr</text>
      <text x="48" y="31" font-size="10.5" fill="#545B64">Audited Shell</text>
    </g>

    <!-- Right-side connectors in clean x=880..940 channel -->
    <path d="M 630 228 H 902 V 181 H 939" fill="none" stroke="#3F8624" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <path d="M 630 238 H 894 V 265 H 939" fill="none" stroke="#545B64" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="963" y1="284" x2="963" y2="325" stroke="#545B64" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M 760 259 H 824 V 433 H 939" fill="none" stroke="#545B64" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>

    <!-- Operator -> SSM -> ASG -->
    <path d="M 88 534 H 124 V 592 H 963 V 541" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M 944 517 H 894 V 542 H 630" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
</svg>
