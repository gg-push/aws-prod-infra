framework:
  - terraform

skip-path:
  # Local Floci emulator target intentionally uses placeholder credentials/flags.
  - environments/local-floci

skip-check:
  # FinOps: S3 access logging buckets and cross-region replication omitted to avoid extra storage/transfer cost.
  - CKV_AWS_18
  - CKV_AWS_144
  # FinOps: SSE-S3 (AES256) used on S3 buckets and default CloudWatch Log Group encryption to avoid KMS CMK monthly fees.
  - CKV_AWS_145
  - CKV_AWS_158
  # FinOps: Paid RDS add-ons (Enhanced Monitoring, Performance Insights, KMS CMK) omitted for Free Tier / t3.micro sizing.
  - CKV_AWS_118
  - CKV_AWS_157
  - CKV_AWS_353
  - CKV_AWS_354
  # Custom Postgres query-logging parameter group omitted to avoid PII/perf overhead; postgresql & upgrade logs export to CloudWatch.
  - CKV2_AWS_30
  # Event notifications on S3 buckets are not used in this workload.
  - CKV2_AWS_62
  # FinOps: ALB S3 access logging and AWS WAF WebACL omitted unless explicitly budgeted.
  - CKV_AWS_91
  - CKV2_AWS_28
  # Nitro instances (t3.micro) are EBS-optimized by default.
  - CKV_AWS_135
  # Checkov cross-module graph limitation: SGs are created in modules/vpc and attached in modules/{alb,compute,rds}.
  - CKV2_AWS_5
  # FinOps: CloudWatch Log retention set to 14d (staging) / 30d (prod) rather than >= 365 days.
  - CKV_AWS_338
